<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b224ef" />
      <stop offset="100%" stop-color="#7579ff" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(0, 242, 254, 0.2)" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGradient)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic / Animated Circuit Nodes and Data Flow Lines (Background Layers) -->
  <g opacity="0.6">
    <!-- Flow Line 1 -->
    <path d="M 50 100 Q 300 40 600 100 T 1150 100" fill="none" stroke="url(#cyanGlow)" stroke-width="2" stroke-dasharray="12 8">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="12s" repeatCount="indefinite" />
    </path>
    <!-- Flow Line 2 -->
    <path d="M 80 280 Q 400 330 750 270 T 1120 280" fill="none" stroke="url(#purpleGlow)" stroke-width="2" stroke-dasharray="15 10">
      <animate attributeName="stroke-dashoffset" from="0" to="250" dur="15s" repeatCount="indefinite" />
    </path>
    <!-- Vertical Connectors -->
    <line x1="180" y1="40" x2="180" y2="320" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" stroke-dasharray="6 6" />
    <line x1="1020" y1="40" x2="1020" y2="320" stroke="rgba(178, 36, 239, 0.15)" stroke-width="1.5" stroke-dasharray="6 6" />
  </g>

  <!-- Ambient Glowing Orbs / Pulses in Background -->
  <circle cx="180" cy="100" r="45" fill="#00f2fe" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="40;55;40" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="270" r="50" fill="#b224ef" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="45;60;45" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Protocol Node Hubs (Left & Right Visuals) -->
  <g transform="translate(130, 150)">
    <rect x="-40" y="-35" width="80" height="70" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="#00f2fe" stroke-width="1.5" />
    <text x="0" y="-8" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="bold">CLIENT</text>
    <text x="0" y="14" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">Claude / IDE</text>
    <circle cx="0" cy="35" r="4" fill="#00f2fe">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <g transform="translate(1070, 150)">
    <rect x="-40" y="-35" width="80" height="70" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="#a855f7" stroke-width="1.5" />
    <text x="0" y="-8" text-anchor="middle" fill="#c084fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="bold">MCP SERVER</text>
    <text x="0" y="14" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">Tools / APIs</text>
    <circle cx="0" cy="35" r="4" fill="#a855f7">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Connecting Stream between Nodes -->
  <line x1="170" y1="150" x2="1030" y2="150" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <circle r="3" fill="#38bdf8">
    <animateMotion path="M 170 150 L 1030 150" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#e879f9">
    <animateMotion path="M 1030 150 L 170 150" dur="4.5s" repeatCount="indefinite" />
  </circle>

  <!-- Main Hero Content: Foreground (Guaranteed Unhidden & Clear) -->
  <g>
    <!-- Badge Pill -->
    <g transform="translate(600, 72)">
      <rect x="-160" y="-15" width="320" height="30" rx="15" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <circle cx="-138" cy="0" r="4" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-124" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">MODEL CONTEXT PROTOCOL</text>
      <text x="96" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">• ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Awesome MCP Tools &amp; Debugging
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="188" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0.2">
      The Definitive Index of Model Context Protocol Servers, Tool Registries, Evaluators &amp; Inspectors
    </text>

    <!-- Interactive / Status Pills in Foreground -->
    <g transform="translate(600, 245)">
      <!-- Pill 1: Inspector -->
      <g transform="translate(-260, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🔍 Inspectors &amp; Evals</text>
      </g>
      <!-- Pill 2: Frameworks -->
      <g transform="translate(-85, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">⚡ FastMCP &amp; SDKs</text>
      </g>
      <!-- Pill 3: Catalogs -->
      <g transform="translate(90, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">📚 Server Registries</text>
      </g>
      <!-- Pill 4: SaaS Gateways -->
      <g transform="translate(265, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🌐 Agent Gateways</text>
      </g>
    </g>

    <!-- Version / Status Footer Line -->
    <text x="600" y="305" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">
      OPEN STANDARD • STANDARDIZED PROTOCOL • JSON-RPC TRANSPORTS
    </text>
  </g>
</svg>